<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>ESI Ventures LLC | Strategic Investment</title>

    <meta name="title" content="ESI Ventures LLC | Strategic Investment & Project Management">
    <meta name="description" content="ESI Ventures LLC is a strategic investment group specializing in digital assets, global education, and technology-driven projects.">
    <link rel="icon" type="image/png" href="imagenes/isotipo-transp.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        html, body { scroll-behavior: smooth; overflow-x: hidden; width: 100%; position: relative; }
        body { font-family: 'Inter', sans-serif; background: #020617; color: white; }
        h1, h2, h3, h4, .serif { font-family: 'Cormorant Garamond', serif; }
        .lang-hidden { display: none !important; }
        section { scroll-margin-top: 100px; width: 100%; overflow: hidden; }
        
        .nav-light { 
            background: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(10px); 
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            left: 0; right: 0;
        }
        .nav-link-dark { color: #0f172a; transition: color 0.3s ease; }
        .nav-link-dark:hover { color: #d4af37; }
        .lang-switcher-dark { border-color: rgba(0, 0, 0, 0.1); color: #0f172a; }

        .hero-bg {
            position: absolute; inset: 0;
            background: linear-gradient(rgba(2, 6, 23, 0.7), rgba(2, 6, 23, 0.9)), url('imagenes/hero2.jpeg');
            background-size: cover; background-position: center; z-index: 0;
        }

        .section-title { 
            font-size: 1.1rem; font-weight: 800; text-transform: uppercase; 
            letter-spacing: 0.5em; color: #d4af37; margin-bottom: 2rem; display: block; 
        }

        /* Portfolio Logo Effects */
        .logo-container {
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            filter: grayscale(1) contrast(0.8) opacity(0.7);
        }
        .glass-card:hover .logo-container {
            filter: grayscale(0) contrast(1) opacity(1);
            transform: scale(1.05);
        }

        .btn-gold, .btn-outline {
            padding: 16px 40px; font-size: 11px; font-weight: 700; text-transform: uppercase; 
            letter-spacing: 0.25em; transition: all 0.3s ease; border-radius: 2px; 
            display: inline-flex; align-items: center; justify-content: center; min-width: 240px; cursor: pointer;
        }
        .btn-gold { background-color: #d4af37; color: #020617; }
        .btn-gold:hover { background-color: #e5c158; transform: translateY(-2px); }
        .btn-outline { border: 1px solid rgba(255,255,255,0.3); color: white; }
        .btn-outline:hover { background: rgba(255,255,255,0.05); border-color: white; transform: translateY(-2px); }

        .glass-card {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; height: 100%;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover { transform: translateY(-10px); border-color: rgba(212, 175, 55, 0.4); background: rgba(255, 255, 255, 0.05); }
        
        .legal-body h4 { color: #d4af37; font-size: 1.1rem; text-transform: uppercase; margin-top: 2rem; border-bottom: 1px solid rgba(212, 175, 55, 0.2); display: inline-block; }
        .legal-body p { color: #cbd5e1; margin-bottom: 1.4rem; line-height: 1.8; font-size: 0.95rem; }
        .footer-logo-blend { mix-blend-mode: multiply; filter: contrast(1.1); }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-50 nav-light py-3">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <a href="#"><img src="imagenes/isotipo-transp.png" alt="ESI Ventures" class="h-8 md:h-12"></a>
            <div class="hidden md:flex gap-8 text-[11px] tracking-[0.2em] uppercase font-bold">
                <a href="#about" class="nav-link-dark" data-lang="en">About</a>
                <a href="#about" class="nav-link-dark lang-hidden" data-lang="es">Nosotros</a>
                <a href="#philosophy" class="nav-link-dark" data-lang="en">Philosophy</a>
                <a href="#philosophy" class="nav-link-dark lang-hidden" data-lang="es">Filosofía</a>
                <a href="#ventures" class="nav-link-dark" data-lang="en">Ventures</a>
                <a href="#ventures" class="nav-link-dark lang-hidden" data-lang="es">Empresas</a>
                <a href="#contact" class="nav-link-dark" data-lang="en">Contact</a>
                <a href="#contact" class="nav-link-dark lang-hidden" data-lang="es">Contacto</a>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex gap-4 text-[10px] font-bold border lang-switcher-dark rounded-full px-4 py-2">
                    <button onclick="setLanguage('en')" id="btn-en">EN</button>
                    <span class="opacity-20">|</span>
                    <button onclick="setLanguage('es')" id="btn-es">ES</button>
                </div>
                <button class="md:hidden text-slate-900" onclick="toggleMenu()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                    </svg>
                </button>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-slate-100 flex flex-col p-6 gap-4 text-[11px] tracking-[0.2em] uppercase font-bold shadow-xl">
            <a href="#about" onclick="toggleMenu()" class="nav-link-dark" data-lang="en">About</a>
            <a href="#about" onclick="toggleMenu()" class="nav-link-dark lang-hidden" data-lang="es">Nosotros</a>
            <a href="#philosophy" onclick="toggleMenu()" class="nav-link-dark" data-lang="en">Philosophy</a>
            <a href="#philosophy" onclick="toggleMenu()" class="nav-link-dark lang-hidden" data-lang="es">Filosofía</a>
            <a href="#ventures" onclick="toggleMenu()" class="nav-link-dark" data-lang="en">Ventures</a>
            <a href="#ventures" onclick="toggleMenu()" class="nav-link-dark lang-hidden" data-lang="es">Empresas</a>
            <a href="#contact" onclick="toggleMenu()" class="nav-link-dark" data-lang="en">Contact</a>
            <a href="#contact" onclick="toggleMenu()" class="nav-link-dark lang-hidden" data-lang="es">Contacto</a>
        </div>
    </nav>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });

        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            if (menu) menu.classList.toggle('hidden');
        }

        function setLanguage(lang) {
            document.querySelectorAll('[data-lang]').forEach(el => { el.classList.toggle('lang-hidden', el.getAttribute('data-lang') !== lang); });
            document.getElementById('btn-en').style.opacity = lang === 'en' ? '1' : '0.3';
            document.getElementById('btn-es').style.opacity = lang === 'es' ? '1' : '0.3';
            localStorage.setItem('prefLang', lang);
        }
        window.onload = () => setLanguage(localStorage.getItem('prefLang') || 'en');

        const legalTexts = {
            privacy: {
                en: { 
                    title: "Privacy Policy", 
                    content: `<h4>1. Information We Collect</h4>
                              <p>We only collect information that you voluntarily provide to us when you fill out our contact form, such as your name and email address.</p>
                              <h4>2. How We Use Your Information</h4>
                              <p>We use the information we collect to respond to your inquiries and provide you with information about our services.</p>
                              <h4>3. Data Security</h4>
                              <p>We take reasonable measures to protect your information from unauthorized access, use, or disclosure.</p>` 
                },
                es: { 
                    title: "Política de Privacidad", 
                    content: `<h4>1. Información que Recopilamos</h4>
                              <p>Solo recopilamos la información que usted nos proporciona voluntariamente al completar nuestro formulario de contacto, como su nombre y dirección de correo electrónico.</p>
                              <h4>2. Cómo Utilizamos su Información</h4>
                              <p>Utilizamos la información para responder a sus consultas y proporcionarle información sobre nuestros servicios.</p>
                              <h4>3. Seguridad de los Datos</h4>
                              <p>Tomamos medidas razonables para proteger su información contra el acceso, uso o divulgación no autorizados.</p>` 
                }
            },
            terms: {
                en: { title: "Terms of Service", content: "<h4>1. Acceptance of Terms</h4><p>By accessing this website, you agree to be bound by these Terms of Service and all applicable laws and regulations.</p><h4>2. Intellectual Property</h4><p>All content on this website is the property of ESI Ventures LLC and is protected by copyright and other intellectual property laws.</p>" },
                es: { title: "Términos de Servicio", content: "<h4>1. Aceptación de los Términos</h4><p>Al acceder a este sitio web, usted acepta estar sujeto a estos Términos de Servicio y a todas las leyes y regulaciones aplicables.</p><h4>2. Propiedad Intelectual</h4><p>Todo el contenido de este sitio web es propiedad de ESI Ventures LLC y está protegido por las leyes de derechos de autor y otras leyes de propiedad intelectual.</p>" }
            },
            cookies: {
                en: { title: "Cookie Policy", content: "<p>We use cookies to improve your experience on our website. Cookies are small files that are stored on your computer or mobile device when you visit a website. You can choose to disable cookies in your browser settings, but this may affect your ability to use certain features of our website.</p>" },
                es: { title: "Política de Cookies", content: "<p>Utilizamos cookies para mejorar su experiencia en nuestro sitio web. Las cookies son pequeños archivos que se almacenan en su computadora o dispositivo móvil. Puede optar por desactivar las cookies en la configuración de su navegador, pero esto puede afectar su capacidad para utilizar ciertas funciones.</p>" }
            },
            disclaimer: {
                en: { title: "Disclaimer", content: "<h4>1. No Investment Advice</h4><p>The information on this website is for informational purposes only and does not constitute investment advice. You should consult with a qualified financial advisor before making any investment decisions.</p><h4>2. Accuracy of Information</h4><p>We make every effort to ensure the accuracy of the information on this website, but we make no representations or warranties of any kind.</p>" },
                es: { title: "Aviso Legal", content: "<h4>1. Sin Asesoramiento de Inversión</h4><p>La información en este sitio web es solo para fines informativos y no constituye asesoramiento de inversión. Debe consultar con un asesor financiero calificado antes de tomar decisiones.</p><h4>2. Exactitud de la Información</h4><p>Hacemos todo lo posible para garantizar la exactitud de la información, pero no ofrecemos garantías de ningún tipo.</p>" }
            }
        };

        function openLegal(type) {
            const lang = localStorage.getItem('prefLang') || 'en';
            document.getElementById('modal-title').innerText = legalTexts[type][lang].title;
            document.getElementById('modal-content').innerHTML = legalTexts[type][lang].content;
            document.getElementById('legal-modal').classList.remove('hidden');
            document.getElementById('legal-modal').classList.add('flex');
        }
        function closeLegal() { document.getElementById('legal-modal').classList.add('hidden'); document.getElementById('legal-modal').classList.remove('flex'); }
    </script>
</body>
</html>
